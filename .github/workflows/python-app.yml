name: Run Telegram News Bot 24/7

on:
  schedule:
    - cron: '*/2 * * * *'  # تشغيل تلقائي كل دقيقتين
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser

    - name: Run Bot
      run: |
        python main.py
