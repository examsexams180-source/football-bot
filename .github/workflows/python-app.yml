name: Run Telegram News Bot 24/7

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests

    - name: Run Bot from correct directory
      run: |
        # الانتقال المباشر للمجلد الفرعي حيث تتواجد الملفات وتشغيل السكريبت بشكل صحيح
        cd football-bot || true
        python main.py
