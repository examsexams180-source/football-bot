name: Run Telegram News Bot 24/7

on:
  schedule:
    - cron: '*/2 * * * *'  # هذا المنبه سيشغل البوت تلقائياً في الخلفية كل دقيقتين!
  workflow_dispatch:     # يتيح لك أيضاً إمكانية تشغيله يدوياً متى شئت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser beautifulsoup4

    - name: Run Bot
      run: |
        python main.py
